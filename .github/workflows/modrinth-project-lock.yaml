name: Modrinth project lock-file
on:
  workflow_dispatch:
  schedule:
    - cron: "12 20 * * 0"
      timezone: "America/Toronto"

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: seanchristians/modrinth-project-lock@38a055cfb848105a75abfdc6af1b6de43eb31b3e # v1.1.0
        with:
          project-file: services/minecraft-server/modrinth.yaml
